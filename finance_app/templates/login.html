{% extends 'base.html' %}
{% block title %}Вход — FinTrack{% endblock %}

{% block content %}
<div class="container-sm">
  <a href="{{ url_for('index') }}" class="navbar-logo" style="display:inline-flex;margin-top:20px">◈ Fin<span>Track</span></a>
  <div class="auth-card">
    <div class="auth-title">С возвращением</div>
    <div class="auth-sub">Войдите, чтобы увидеть свои финансы</div>

    <form class="auth-form" method="POST">
      <div class="field">
        <label class="field-label">Email</label>
        <input class="field-input" type="email" name="email" placeholder="you@example.com" required autofocus>
      </div>
      <div class="field">
        <label class="field-label">Пароль</label>
        <input class="field-input" type="password" name="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:13px">
        Войти
      </button>
    </form>

    <div class="auth-switch">
      Нет аккаунта? <a href="{{ url_for('register') }}">Зарегистрируйтесь</a>
    </div>
  </div>
</div>
{% endblock %}
